<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc">
  <title id="title">Bayesian trajectory selection pipeline</title>
  <desc id="desc">Twelve thousand problems pass through a 72B teacher and a 3B student with MC dropout. Entropy and mutual information independently select one trajectory per problem. Two LoRA adapters are evaluated on MATH-500 and GSM8K.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker>
  </defs>
  <rect width="900" height="590" rx="16" fill="#f8fafc"/>
  <g fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M274 88 H319"/><path d="M576 88 H621"/>
    <path d="M754 138 V175 H260 V208"/><path d="M754 175 H640 V208"/>
    <path d="M260 297 V341"/><path d="M640 297 V341"/>
    <path d="M260 422 V450 H450 V489"/><path d="M640 422 V450 H450" marker-end="none"/>
  </g>
  <g stroke-width="1.5">
    <rect x="26" y="38" width="248" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="326" y="38" width="248" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="626" y="38" width="248" height="100" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="104" y="212" width="312" height="85" rx="10" fill="#edf2fa" stroke="#61769b"/>
    <rect x="484" y="212" width="312" height="85" rx="10" fill="#e9f5f2" stroke="#317f78"/>
    <rect x="104" y="345" width="312" height="77" rx="10" fill="#edf2fa" stroke="#61769b"/>
    <rect x="484" y="345" width="312" height="77" rx="10" fill="#e9f5f2" stroke="#317f78"/>
    <rect x="228" y="493" width="444" height="74" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" text-anchor="middle" fill="#172033">
    <g font-size="23" font-weight="650">
      <text x="150" y="79">12,000 problems</text><text x="450" y="79">72B teacher</text><text x="750" y="79">3B student</text>
      <text x="260" y="247" fill="#445e86">Top-50 entropy</text><text x="640" y="247" fill="#216c64">Top-50 MI</text>
      <text x="260" y="377" fill="#445e86">Entropy LoRA adapter</text><text x="640" y="377" fill="#216c64">MI LoRA adapter</text>
      <text x="450" y="524">MATH-500 + GSM8K</text>
    </g>
    <g font-size="20" fill="#475569">
      <text x="150" y="111">MATH-500 excluded</text><text x="450" y="111">5 candidates / problem</text><text x="750" y="111">10 MC dropout passes</text>
      <text x="260" y="278">Argmax per problem</text><text x="640" y="278">Argmax per problem</text>
      <text x="260" y="405">12,000 selected trajectories</text><text x="640" y="405">12,000 selected trajectories</text>
      <text x="450" y="552">Strict first-boxed-answer ACC@1</text>
    </g>
  </g>
</svg>
